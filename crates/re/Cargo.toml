[package]
name = "kotor-re"
description = "KOTOR file formats (GFF/ERF/saves) and memory/pointer scanning used to map swkotor.exe"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Threading",
]

[features]
# Exposes scan::fake::FakeMemory to other crates' tests.
testing = []
