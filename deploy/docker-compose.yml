# Persistent co-op server that runs 24/7 and restarts with the machine.
#   docker compose -f deploy/docker-compose.yml up -d
services:
  server:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    ports: ["27700:27700"]
    volumes: ["kotor-data:/data"]
    stop_grace_period: 15s   # time to save the world on shutdown

  # Optional: your own server browser + update host.
  master:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    command: ["kotor-master", "--updates-dir", "/data/updates"]
    ports: ["27780:27780"]
    volumes: ["kotor-updates:/data/updates"]

volumes:
  kotor-data:
  kotor-updates:
