[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/server",
    "crates/master",
    "crates/launcher",
    "crates/client",
    "crates/testclient",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/masterxxstabs/kotor-coop"

[workspace.dependencies]
kotor-protocol = { path = "crates/protocol" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
toml = "0.9"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
base64 = "0.22"
ureq = { version = "3", features = ["json"] }

[profile.release]
lto = "thin"
codegen-units = 1
